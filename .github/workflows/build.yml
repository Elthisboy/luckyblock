name: Build (Fabric & NeoForge)

on:
  push:
    branches:
      - port/26.1
      - master
      - main
  pull_request:
    branches:
      - port/26.1
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.1 requires Java 25, and Fabric Loom requires the Gradle
      # daemon itself to run on it (see gradle/gradle-daemon-jvm.properties).
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      # IMPORTANT: publish the jars from dist/, not from */build/libs. Only the
      # exportDist output embeds mod/lucky/java/lucky-config.zip, which the mod
      # unpacks into config/lucky/<version>-<loader> on first launch. A raw
      # build/libs jar crashes at startup with NoSuchFileException on that path.
      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: lucky-block-neoforge
          path: dist/lucky-block-neoforge-*/lucky-block-neoforge-*.jar
          if-no-files-found: error

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: lucky-block-fabric
          path: dist/lucky-block-fabric-*/lucky-block-fabric-*.jar
          if-no-files-found: error

      - name: Verify jars embed the default config
        shell: bash
        run: |
          set -e
          for jar in dist/lucky-block-*/lucky-block-*.jar; do
            if unzip -l "$jar" | grep -q "mod/lucky/java/lucky-config.zip"; then
              echo "ok: $jar"
            else
              echo "FAIL: $jar is missing mod/lucky/java/lucky-config.zip"
              exit 1
            fi
          done

      - name: Upload dist bundles
        uses: actions/upload-artifact@v4
        with:
          name: lucky-block-dist
          path: |
            dist/**/*.jar
            dist/**/*.zip
            dist/**/meta.yaml
          if-no-files-found: warn
